<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="preload" href="./assets/fonts/Figtree-VariableFont_wght.ttf" as="font" type="font/ttf">
  
  <title>Frontend Mentor | Blog preview card</title>

</head>
<body>
  <main>
    <img id="cover-image" src="./assets/images/illustration-article.svg" alt="Cover image for a blog preview card">
    <div class="content">
      <div class="tag">
        Learning
      </div>
        <p class="date">
          <time datetime="2023-12-21">Published 21 Dec 2023</time>
        </p>
      <h1>
        <a href="https://frontendmentor.io">HTML & CSS foundations</a>
      </h1>
      <p class="description">
        These languages are the backbone of every website, defining structure, content, and presentation.
      </p>
      <div class="author">
        <img src="./assets/images/image-avatar.webp" alt="Author avatar portrait">
        <span class="author-name">
          Greg Hooper
        </span>
      </div>
    </div>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/filiuslupus">filiuslupus</a>.
  </footer>
</body>
</html>
